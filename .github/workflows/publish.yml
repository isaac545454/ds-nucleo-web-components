name: Publish

on:
  push:
    branches: [master]
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@isaac545454'
          always-auth: true

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm run build
      - run: pnpm run typecheck

      - name: Cortar versão a partir do Unreleased
        id: cut
        run: node scripts/release-cut.mjs

      - name: Commit da versão
        if: steps.cut.outputs.commit == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md package.json
          git commit -m "chore: release v${{ steps.cut.outputs.version }}"
          git push origin HEAD:master

      - name: Publicar pacote e criar GitHub Release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ steps.cut.outputs.version }}"
          name="$(node -p "require('./package.json').name")"
          tag="v${version}"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release ${tag} já existe."
            exit 0
          fi

          echo "Publicando ${name}@${version}"
          published="$(npm view "$name" versions --json --registry https://npm.pkg.github.com 2>/dev/null || true)"
          if printf '%s' "$published" | grep -q "\"${version}\""; then
            echo "Pacote ${name}@${version} já está no registry."
          else
            npm publish --access public
          fi

          notes="$(node scripts/release-notes.mjs "$version")"
          gh release create "$tag" --target "$(git rev-parse HEAD)" --title "$tag" --notes "$notes"
